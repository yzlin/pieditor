name: Supa Pi integration

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packed-tarball:
    name: Packed tarball installs in supa-pi
    runs-on: ubuntu-latest

    steps:
      - name: Checkout pieditor
        uses: actions/checkout@v4
        with:
          path: pieditor

      - name: Checkout supa-pi
        uses: actions/checkout@v4
        with:
          repository: yzlin/supa-pi
          path: supa-pi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pieditor dependencies
        run: bun install --frozen-lockfile
        working-directory: pieditor

      - name: Run packed tarball integration gate
        run: bun run integration:supa-pi
        working-directory: pieditor
        env:
          SUPA_PI_DIR: ${{ github.workspace }}/supa-pi
